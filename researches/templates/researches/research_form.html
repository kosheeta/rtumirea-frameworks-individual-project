{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data" class="col-lg-8" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button class="btn btn-primary">Сохранить</button>
        <a href="{% if research %}{{ research.get_absolute_url }}{% else %}{% url 'researches:list' %}{% endif %}"
           class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
