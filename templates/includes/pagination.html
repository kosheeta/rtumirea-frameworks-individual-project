{% if page_obj.paginator.num_pages > 1 %}
<nav>
    <ul class="pagination">
        {% if page_obj.has_previous %}
            <li class="page-item"><a class="page-link" href="?{{ query_string }}&page={{ page_obj.previous_page_number }}">←</a></li>
        {% endif %}
        {% for number in page_obj.paginator.page_range %}
            <li class="page-item {% if number == page_obj.number %}active{% endif %}">
                <a class="page-link" href="?{{ query_string }}&page={{ number }}">{{ number }}</a>
            </li>
        {% endfor %}
        {% if page_obj.has_next %}
            <li class="page-item"><a class="page-link" href="?{{ query_string }}&page={{ page_obj.next_page_number }}">→</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
